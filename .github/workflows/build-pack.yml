name: Build Mira Resource Pack

on:
  push:
    branches: [main]
    paths:
      - "assets/mira/items/**"
      - "assets/mira/models/**"
      - "assets/mira/equipment/**"
      - "assets/mira/textures/**"
      - "pack.mcmeta"
      - "pack.png"
      - "model-registry.json"
      - ".github/workflows/build-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build distributable pack
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          zip -9 -r dist/Mira-Resourcepack-26.2.zip pack.mcmeta pack.png assets
          sha1sum dist/Mira-Resourcepack-26.2.zip | awk '{print $1}' > dist/Mira-Resourcepack-26.2.zip.sha1
          cp dist/Mira-Resourcepack-26.2.zip dist/Mira-Resourcepack-1.21.11.zip
          cp dist/Mira-Resourcepack-26.2.zip.sha1 dist/Mira-Resourcepack-1.21.11.zip.sha1

      - name: Commit generated distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          rm -rf dist
          mkdir -p dist
          zip -9 -r dist/Mira-Resourcepack-26.2.zip pack.mcmeta pack.png assets
          sha1sum dist/Mira-Resourcepack-26.2.zip | awk '{print $1}' > dist/Mira-Resourcepack-26.2.zip.sha1
          cp dist/Mira-Resourcepack-26.2.zip dist/Mira-Resourcepack-1.21.11.zip
          cp dist/Mira-Resourcepack-26.2.zip.sha1 dist/Mira-Resourcepack-1.21.11.zip.sha1
          git add dist/
          if git diff --cached --quiet; then
            echo "Distribution already current."
            exit 0
          fi
          git commit -m "Build Minecraft 26.2 resource pack assets"
          git push origin HEAD:main
